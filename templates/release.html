<!DOCTYPE html>
<html>
<head>
    <title>Release Locker</title>

    <style>

    body{
        background:#f4f6f9;
        font-family:Arial;
    }

    .container{
        width:450px;
        margin:80px auto;
        background:white;
        padding:30px;
        border-radius:10px;
        box-shadow:0 5px 15px rgba(0,0,0,.2);
    }

    h2{
        text-align:center;
        color:#1e3a8a;
    }

    input{
        width:100%;
        padding:12px;
        margin:15px 0;
        border:1px solid #ccc;
        border-radius:5px;
    }

    button{
        width:100%;
        padding:12px;
        background:#dc2626;
        color:white;
        border:none;
        border-radius:5px;
        cursor:pointer;
        font-size:16px;
    }

    button:hover{
        background:#b91c1c;
    }

    </style>

</head>

<body>

<div class="container">

<h2>♻ Release Locker</h2>

<form method="POST">

<input
type="text"
name="locker_id"
placeholder="Enter Locker ID"
required>

<button type="submit">
Release Locker
</button>

</form>

</div>

</body>
</html>
