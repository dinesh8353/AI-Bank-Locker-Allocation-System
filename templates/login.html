<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bank Locker Allocation System</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Segoe UI,Arial,sans-serif;
}

body{
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:linear-gradient(135deg,#0f172a,#1e3a8a,#2563eb);
}

.login-box{
    width:380px;
    background:rgba(255,255,255,0.12);
    backdrop-filter:blur(15px);
    border-radius:20px;
    padding:35px;
    box-shadow:0 15px 35px rgba(0,0,0,.4);
    color:white;
}

.logo{
    text-align:center;
    font-size:60px;
}

h1{
    text-align:center;
    margin:10px 0;
    font-size:28px;
}

p{
    text-align:center;
    color:#dbeafe;
    margin-bottom:25px;
}

label{
    display:block;
    margin-bottom:8px;
    font-weight:bold;
}

input{
    width:100%;
    padding:12px;
    border:none;
    outline:none;
    border-radius:10px;
    margin-bottom:18px;
    font-size:15px;
}

button{
    width:100%;
    padding:13px;
    border:none;
    border-radius:10px;
    background:#f59e0b;
    color:white;
    font-size:17px;
    font-weight:bold;
    cursor:pointer;
    transition:.3s;
}

button:hover{
    background:#d97706;
    transform:scale(1.03);
}

.footer{
    text-align:center;
    margin-top:20px;
    color:#cbd5e1;
    font-size:13px;
}
</style>

</head>

<body>

<div class="login-box">

<div class="logo">🏦</div>

<h1>Bank Locker Allocation</h1>

<p>Secure Admin Login</p>

<form action="/login" method="POST">

<label>Username</label>
<input type="text" name="username" placeholder="Enter Username" required>

<label>Password</label>
<input type="password" name="password" placeholder="Enter Password" required>

<button type="submit">LOGIN</button>

</form>

<div class="footer">
© 2026 Bank Locker Allocation System
</div>

</div>

</body>
</html>
