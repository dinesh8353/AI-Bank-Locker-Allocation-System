<!DOCTYPE html>
<html>
<head>
    <title>Search Customer</title>

    <style>

    body{
        font-family:Arial;
        background:#f4f6f9;
    }

    .container{
        width:600px;
        margin:50px auto;
        background:white;
        padding:30px;
        border-radius:10px;
        box-shadow:0 5px 15px rgba(0,0,0,.2);
    }

    h2{
        text-align:center;
        color:#1e3a8a;
    }

    input{
        width:100%;
        padding:12px;
        margin:15px 0;
        border:1px solid #ccc;
        border-radius:5px;
    }

    button{
        width:100%;
        padding:12px;
        background:#2563eb;
        color:white;
        border:none;
        border-radius:5px;
        cursor:pointer;
    }

    table{
        width:100%;
        margin-top:25px;
        border-collapse:collapse;
    }

    th,td{
        border:1px solid #ddd;
        padding:10px;
        text-align:center;
    }

    th{
        background:#2563eb;
        color:white;
    }

    </style>

</head>

<body>

<div class="container">

<h2>🔍 Search Customer</h2>

<form method="POST">

<input type="text"
name="customer"
placeholder="Enter Customer Name"
required>

<button type="submit">
Search
</button>

</form>

{% if result %}

<table>

<tr>
<th>Locker ID</th>
<th>Size</th>
<th>Status</th>
<th>Date</th>
</tr>

<tr>
<td>{{ result.locker_id }}</td>
<td>{{ result.size }}</td>
<td>{{ result.status }}</td>
<td>{{ result.allotted_on }}</td>
</tr>

</table>

{% endif %}

</div>

</body>
</html>
